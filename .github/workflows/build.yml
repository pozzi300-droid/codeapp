name: Build CodeApp (Unsigned)

on:
  workflow_dispatch: # Кнопка для ручного запуска в Actions

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Скачиваем исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Запуск официального скрипта загрузки фреймворков
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 3. Сборка проекта через xcodebuild (Без подписи)
        run: |
          xcodebuild clean build \
            -project "Code.xcodeproj" \
            -scheme "Code" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build"

      - name: 4. Упаковка скомпилированного приложения в .ipa файл
        run: |
          mkdir -p Payload
          # Находим скомпилированное приложение Code.app и перемещаем его в папку Payload
          find build -name "Code.app" -exec mv {} Payload/ \;
          zip -qr CodeApp.ipa Payload

      - name: 5. Сохранение готового файла
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
