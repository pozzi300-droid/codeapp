name: Build CodeApp (100% Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Скачиваем исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Загрузка бинарных фреймворков
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 3. Умный патч проекта (Удаляем расширение и чиним скрипты)
        run: |
          gem install xcodeproj
          cat << 'EOF' > patch.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Code.xcodeproj')

          # 1. Полностью удаляем цель 'extension' из проекта, чтобы Apple не требовала для него профиль
          extension_target = project.targets.find { |t| t.name == 'extension' }
          project.targets.delete(extension_target) if extension_target

          project.targets.each do |target|
            # 2. Очищаем все зависимости основной программы от этого расширения
            target.dependencies.delete_if { |dep| dep.target && dep.target.name == 'extension' }
            
            # 3. Удаляем файл .appex из фазы копирования (Embed App Extensions)
            target.copy_files_build_phases.each do |phase|
              phase.files.to_a.each do |build_file|
                if build_file.file_ref && build_file.file_ref.path && build_file.file_ref.path.end_with?('.appex')
                  phase.remove_build_file(build_file)
                end
              end
            end
            
            # 4. Спасаем внутренние скрипты Code App (меняем пустую подпись на локальную Ad-Hoc)
            target.shell_script_build_phases.each do |phase|
              if phase.shell_script
                phase.shell_script = phase.shell_script.gsub('$EXPANDED_CODE_SIGN_IDENTITY', '-')
                phase.shell_script = phase.shell_script.gsub('${EXPANDED_CODE_SIGN_IDENTITY}', '-')
              end
            end
          end

          project.save
          EOF
          ruby patch.rb

      - name: 4. Сборка проекта (Чистый Unsigned)
        run: |
          # Теперь мы можем легально отключить подпись, и Xcode не выдаст ни одной ошибки
          xcodebuild clean build \
            -project "Code.xcodeproj" \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$(pwd)/build"

      - name: 5. Упаковка в .ipa
        run: |
          mkdir -p Payload
          # Берем только главное приложение из папки успешной сборки
          mv build/Release-iphoneos/*.app Payload/
          zip -qr CodeApp.ipa Payload

      - name: 6. Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Final-IPA
          path: CodeApp.ipa
