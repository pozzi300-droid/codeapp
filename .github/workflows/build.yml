name: Build CodeApp (Nuclear Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Скачиваем исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Загрузка бинарных фреймворков
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 3. Ядерный патч проекта (Удаляем подпись, расширения, скрипты и превью-ресурсы)
        run: |
          # Физически удаляем ненужную папку с превью-ресурсами, которая вызывает сбой
          rm -rf "CodeApp/Preview Content"
          
          gem install xcodeproj
          cat << 'EOF' > patch.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Code.xcodeproj')

          # 1. Удаляем расширение (оно ломает сборку без подписи)
          ext = project.targets.find { |t| t.name == 'extension' }
          project.targets.delete(ext) if ext

          # 2. Удаляем файлы и группы Preview Content из структуры проекта Xcode
          project.objects.each do |obj|
            if obj.respond_to?(:path) && obj.path && (obj.path.include?('Preview Content') || obj.path.include?('Preview Assets'))
              obj.remove_from_project
            end
          end

          project.targets.each do |target|
            # Очищаем зависимости от расширения
            target.dependencies.delete_if { |dep| dep.target && dep.target.name == 'extension' }
            
            target.copy_files_build_phases.each do |phase|
              phase.files.to_a.each do |bf|
                phase.remove_build_file(bf) if bf.file_ref && bf.file_ref.path && bf.file_ref.path.end_with?('.appex')
              end
            end

            # 3. Заменяем скрипты с codesign
            target.shell_script_build_phases.each do |phase|
              if phase.shell_script && phase.shell_script.include?('codesign')
                phase.shell_script = "echo 'Codesign skipped successfully'"
              end
            end

            # 4. Вырезаем все проверки подписи, entitlements и пути превью-ресурсов
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_ASSET_PATHS'] = '""'
              config.build_settings.delete('CODE_SIGN_ENTITLEMENTS')
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['ENTITLEMENTS_REQUIRED'] = 'NO'
            end
          end
          project.save
          EOF
          ruby patch.rb

      - name: 4. Сборка проекта
        run: |
          xcodebuild clean build \
            -project "Code.xcodeproj" \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            BUILD_DIR="$(pwd)/build"

      - name: 5. Упаковка в .ipa
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -qr CodeApp.ipa Payload

      - name: 6. Сохранение результата
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Final-IPA
          path: CodeApp.ipa
