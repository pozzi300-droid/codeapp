name: Build CodeApp (Unsigned)

on:
  workflow_dispatch: # Кнопка для ручного запуска в Actions

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Скачиваем исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Запуск официального скрипта загрузки фреймворков
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 3. Авто-определение схемы и компиляция (Без подписи)
        run: |
          # 3.1. Генерируем схемы
          echo "=== Доступные схемы ==="
          xcodebuild -list -project "Code.xcodeproj"
          
          # 3.2. Находим первую доступную схему
          SCHEME=$(xcodebuild -list -project "Code.xcodeproj" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          
          echo "================================="
          echo "Выбрана схема: '$SCHEME'"
          echo "================================="
          
          if [ -z "$SCHEME" ]; then
            echo "Ошибка: Схема не найдена!"
            exit 1
          fi
          
          # 3.3. Компилируем найденную схему без подписи
          xcodebuild clean build \
            -project "Code.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="$(pwd)/build"

      - name: 4. Упаковка скомпилированного приложения в .ipa файл
        run: |
          mkdir -p Payload
          # Ищем любой скомпилированный файл .app в папке сборки и перемещаем в Payload
          find build -name "*.app" -exec mv {} Payload/ \;
          zip -qr CodeApp.ipa Payload

      - name: 5. Сохранение готового файла
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
