name: Build CodeApp IPA

on:
  workflow_dispatch: # Кнопка для ручного запуска в Actions

jobs:
  build:
    runs-on: macos-latest # Запуск на сервере Mac от GitHub

    steps:
      - name: 1. Скачиваем исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Скачиваем бинарные фреймворки (Python, Node и др.)
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: 3. Авто-определение схемы и компиляция проекта
        run: |
          # 3.1. Принудительно генерируем схемы по умолчанию и выводим их список в лог
          echo "=== Доступные схемы в проекте ==="
          xcodebuild -list -project "Code.xcodeproj"
          
          # 3.2. Автоматически находим первую доступную схему
          SCHEME=$(xcodebuild -list -project "Code.xcodeproj" | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag' | sed 's/^[[:space:]]*//' | head -n 1)
          
          echo "================================="
          echo "Автоматически выбрана схема: '$SCHEME'"
          echo "================================="
          
          if [ -z "$SCHEME" ]; then
            echo "Ошибка: Не удалось обнаружить ни одной схемы в Xcode проекте!"
            exit 1
          fi
          
          # 3.3. Запускаем сборку найденной схемы
          xcodebuild clean build \
            -project "Code.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$(pwd)/build"

      - name: 4. Упаковка в .ipa файл
        run: |
          mkdir -p Payload
          # Находим скомпилированное приложение .app и перемещаем в папку Payload
          find build -name "*.app" -exec mv {} Payload/ \;
          zip -qr CodeApp.ipa Payload

      - name: 5. Сохранение готового файла
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Unsigned-IPA
          path: CodeApp.ipa
