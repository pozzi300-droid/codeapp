name: Build IPA with C# Support

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Build verified Mono runtime and managed payload
        run: |
          chmod +x scripts/build-mono-ios.sh
          scripts/build-mono-ios.sh

      - name: Nuclear patch (remove signing, extensions, previews)
        run: |
          rm -rf "CodeApp/Preview Content"
          rm -f "Iconv2.icon"
          gem install xcodeproj
          cat << 'EOF' > patch.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Code.xcodeproj')

          project.objects.each do |obj|
            if obj.respond_to?(:path) && obj.path && (obj.path.include?('Preview Content') || obj.path.include?('Preview Assets'))
                obj.remove_from_project
            end
          end

          project.targets.each do |target|
            target.shell_script_build_phases.each do |phase|
              if phase.shell_script && phase.shell_script.include?('codesign')
                phase.shell_script = "echo 'Codesign skipped successfully'"
              end
            end

            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_ASSET_PATHS'] = '""'
              config.build_settings.delete('CODE_SIGN_ENTITLEMENTS')
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['ENTITLEMENTS_REQUIRED'] = 'NO'
              config.build_settings.delete('ASSETCATALOG_COMPILER_APPICON_NAME')
            end
          end
          project.save
          EOF
          ruby patch.rb

          # Remove Iconv2 references from pbxproj
          sed -i '' '/Iconv2/d' Code.xcodeproj/project.pbxproj

      - name: Build
        run: |
          xcodebuild clean build \
            -project "Code.xcodeproj" \
            -scheme "Code App" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO \
            ENABLE_PREVIEWS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            BUILD_DIR="$(pwd)/build"

      - name: Verify C# payload in built app
        run: |
          APP="$(find build/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          if [[ -z "$APP" ]]; then
            echo "No .app bundle was produced." >&2
            find build -maxdepth 3 -print
            exit 1
          fi

          require_file() {
            if [[ ! -f "$1" ]]; then
              echo "Required bundle file is missing: $1" >&2
              find "$APP" -maxdepth 4 -type f -print | sort
              exit 1
            fi
          }

          require_file "$APP/MonoManaged/runtime/System.Private.CoreLib.dll"
          require_file "$APP/MonoManaged/tools/csc.dll"
          require_file "$APP/MonoManaged/ref/System.Runtime.dll"
          find "$APP" -type d -name '*.appex' -print > "$RUNNER_TEMP/embedded-extensions.txt"
          if [[ ! -s "$RUNNER_TEMP/embedded-extensions.txt" ]]; then
            echo "The App Extension is missing from the built app." >&2
            find "$APP" -maxdepth 4 -print | sort
            exit 1
          fi
          nm -gU "$APP/Code" > "$RUNNER_TEMP/code-symbols.txt"
          for symbol in _codeapp_mono_exec _mono_jit_init; do
            if ! grep -q "${symbol}$" "$RUNNER_TEMP/code-symbols.txt"; then
              echo "Required native symbol is missing: $symbol" >&2
              grep -E 'mono|codeapp' "$RUNNER_TEMP/code-symbols.txt" || true
              exit 1
            fi
          done
          echo "Embedded extensions:"
          cat "$RUNNER_TEMP/embedded-extensions.txt"
          du -sh "$APP" "$APP/MonoManaged"

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -qr CodeApp-CSharp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-CSharp-IPA
          path: CodeApp-CSharp.ipa
