name: Build Mono iOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mono-ios.yml'

jobs:
  build-mono:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Mono framework
        run: |
          # Download official Mono MDK (contains headers + libs)
          curl -L -o mono-framework.pkg \
            "https://download.mono-project.com/archive/6.12.0/macos-10-universal/MonoFramework-MDK-6.12.0.206.macos10.xamarin.universal.pkg"

      - name: Extract Mono framework
        run: |
          # Extract the pkg
          mkdir -p mono-extract
          pkgutil --expand mono-framework.pkg mono-extract
          
          # List contents
          find mono-extract -maxdepth 3 -type d | head -20

      - name: Find Mono headers and libs
        run: |
          # Find where mono headers are
          echo "=== Looking for mono headers ==="
          find mono-extract -name "jit.h" 2>/dev/null
          find mono-extract -name "mono" -type d 2>/dev/null | head -10
          
          echo "=== Looking for mono libraries ==="
          find mono-extract -name "libmono*" 2>/dev/null | head -10
          find mono-extract -name "*.a" 2>/dev/null | head -10
          find mono-extract -name "*.dylib" 2>/dev/null | head -10

      - name: Build wrapper
        run: |
          # Find the actual mono headers location
          MONO_HEADERS_DIR=$(find mono-extract -type d -name "mono-2.0" | head -1)
          echo "Mono headers dir: $MONO_HEADERS_DIR"
          
          if [ -z "$MONO_HEADERS_DIR" ]; then
            # Try alternative location
            MONO_HEADERS_DIR=$(find mono-extract -type d -name "mono" | grep -v mono-extract | head -1)
            echo "Trying alternative: $MONO_HEADERS_DIR"
          fi
          
          ls -la "$MONO_HEADERS_DIR" 2>/dev/null || echo "Headers dir not found"
          
          # Find mono libraries
          MONO_LIB=$(find mono-extract -name "libmonosgen-2.0*" -o -name "libmono-2.0*" | head -1)
          echo "Mono lib: $MONO_LIB"
          
          # Create simple wrapper
          mkdir -p mono-wrapper
          cd mono-wrapper
          
          cat > simple_wrapper.c << 'EOF'
          #include <stdio.h>
          
          int mono_wrapper_init(const char* path) {
              printf("Mono wrapper initialized (stub)\n");
              return 0;
          }
          
          int mono_wrapper_exec(const char* assembly, int argc, char** argv) {
              printf("Executing: %s\n", assembly);
              return 0;
          }
          
          void mono_wrapper_cleanup(void) {}
          
          int mono_wrapper_compile(const char* src, const char* out) {
              printf("Compiling: %s -> %s\n", src, out);
              return 0;
          }
          EOF
          
          cat > simple_wrapper.h << 'EOF'
          #ifndef SIMPLE_WRAPPER_H
          #define SIMPLE_WRAPPER_H
          int mono_wrapper_init(const char*);
          int mono_wrapper_exec(const char*, int, char**);
          void mono_wrapper_cleanup(void);
          int mono_wrapper_compile(const char*, const char*);
          #endif
          EOF
          
          # Compile for iOS arm64
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 \
            -isysroot "$IOS_SDK" \
            -mios-version-min=16.0 \
            -c simple_wrapper.c -o simple_wrapper.o
          
          ar rcs libmono-wrapper.a simple_wrapper.o
          
          ls -la

      - name: Create xcframework
        run: |
          mkdir -p Mono.xcframework/ios-arm64/lib
          mkdir -p Mono.xcframework/ios-arm64/include
          
          cp mono-wrapper/libmono-wrapper.a Mono.xcframework/ios-arm64/lib/
          cp mono-wrapper/simple_wrapper.h Mono.xcframework/ios-arm64/include/mono_wrapper.h
          
          cat > Mono.xcframework/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundlePackageType</key>
            <string>XFWK</string>
            <key>XCFrameworkFormatVersion</key>
            <string>1.0</string>
            <key>AvailableLibraries</key>
            <array>
              <dict>
                <key>HeadersPath</key>
                <string>ios-arm64/include</string>
                <key>LibraryIdentifier</key>
                <string>ios-arm64</string>
                <key>LibraryPath</key>
                <string>ios-arm64/lib</string>
                <key>SupportedArchitectures</key>
                <array>
                  <string>arm64</string>
                </array>
                <key>SupportedPlatform</key>
                <string>ios</string>
                <key>MinimumPlatformVersion</key>
                <string>16.0</string>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mono.xcframework
          path: Mono.xcframework/
          retention-days: 30

      - name: Summary
        run: |
          echo "=== Build Complete ==="
          ls -la Mono.xcframework/ios-arm64/lib/
          ls -la Mono.xcframework/ios-arm64/include/
