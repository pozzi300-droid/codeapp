name: Build real Mono iOS runtime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build and validate iOS Mono payload
        run: |
          chmod +x scripts/build-mono-ios.sh
          scripts/build-mono-ios.sh

      - name: Compile native host against produced headers
        run: |
          SLICE="Resources/Mono/MonoRuntime.xcframework/ios-arm64"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -mios-version-min=16.0 \
            -I "$SLICE/Headers" \
            -c MonoHost/codeapp_mono_host.c \
            -o "$RUNNER_TEMP/codeapp_mono_host.o"

      - name: Upload verified runtime
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-Mono-iOS-arm64
          path: Resources/Mono/
          retention-days: 30
