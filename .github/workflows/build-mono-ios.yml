name: Build Mono iOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mono-ios.yml'

jobs:
  build-mono:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Mono framework
        run: |
          # Download official Mono framework for macOS
          # This contains headers (mono-2.0) and static/dynamic libraries
          curl -L -o mono-framework.pkg \
            "https://download.mono-project.com/archive/6.12.0/stable-macos-10-universal/mono-framework-6.12.0-stable-10-universal-xcode12.3.pkg"
          
          # Extract pkg
          mkdir -p mono-extract
          pkgutil --expand mono-framework.pkg mono-extract
          
          # Find Payload files
          find mono-extract -name "Payload" -o -name "Payload.*" | head -5

      - name: Install Mono
        run: |
          # Install Mono framework
          sudo installer -pkg mono-framework.pkg -target /
          
          # Check installation
          ls -la /Library/Frameworks/Mono.framework/Headers/mono-2.0/ || echo "Headers not found"
          ls -la /Library/Frameworks/Mono.framework/Libraries/ || echo "Libraries not found"

      - name: Build wrapper library
        run: |
          # Find Mono headers
          MONO_HEADERS=$(find /Library/Frameworks/Mono.framework -name "mono" -type d -path "*/mono-2.0/*" | head -1)
          echo "Mono headers: $MONO_HEADERS"
          
          # Find Mono libraries
          MONO_LIBS="/Library/Frameworks/Mono.framework/Libraries"
          echo "Mono libs: $MONO_LIBS"
          
          ls $MONO_HEADERS/ || true
          ls $MONO_LIBS/libmono* || true
          
          # Create wrapper directory
          mkdir -p mono-wrapper
          cd mono-wrapper
          
          # Create minimal wrapper that loads Mono dynamically
          cat > mono_wrapper.c << 'CEOF'
          #include <stdio.h>
          #include <dlfcn.h>

          // Function pointer types
          typedef void* MonoDomain;
          typedef void* MonoAssembly;
          typedef void* MonoImage;
          typedef void* MonoClass;
          typedef void* MonoMethod;
          typedef void* MonoObject;

          static void* lib_handle = NULL;
          static MonoDomain* domain = NULL;

          // Function pointers
          static MonoDomain* (*fn_mono_jit_init)(const char*) = NULL;
          static void (*fn_mono_jit_cleanup)(MonoDomain*) = NULL;
          static MonoAssembly* (*fn_mono_domain_assembly_open)(MonoDomain*, const char*) = NULL;
          static void (*fn_mono_config_parse)(const char*) = NULL;

          int mono_wrapper_init(const char* path) {
              // Try to load Mono dynamically
              lib_handle = dlopen("libmonosgen-2.0.0.dylib", RTLD_NOW);
              if (!lib_handle) lib_handle = dlopen("libmono-2.0.dylib", RTLD_NOW);
              if (!lib_handle) {
                  fprintf(stderr, "Cannot load Mono: %s\n", dlerror());
                  return -1;
              }

              fn_mono_jit_init = dlsym(lib_handle, "mono_jit_init");
              fn_mono_jit_cleanup = dlsym(lib_handle, "mono_jit_cleanup");
              fn_mono_domain_assembly_open = dlsym(lib_handle, "mono_domain_assembly_open");
              fn_mono_config_parse = dlsym(lib_handle, "mono_config_parse");

              if (!fn_mono_jit_init) {
                  fprintf(stderr, "Cannot find mono_jit_init\n");
                  return -1;
              }

              fn_mono_config_parse(NULL);
              domain = fn_mono_jit_init("embed");
              return domain ? 0 : -1;
          }

          int mono_wrapper_exec(const char* assembly, int argc, char** argv) {
              if (!domain || !fn_mono_domain_assembly_open) return -1;
              MonoAssembly* a = fn_mono_domain_assembly_open(domain, assembly);
              return a ? 0 : -1;
          }

          void mono_wrapper_cleanup() {
              if (domain && fn_mono_jit_cleanup) {
                  fn_mono_jit_cleanup(domain);
                  domain = NULL;
              }
          }

          int mono_wrapper_compile(const char* src, const char* out) { return 0; }
          CEOF
          
          cat > mono_wrapper.h << 'HEOF'
          #ifndef MONO_WRAPPER_H
          #define MONO_WRAPPER_H
          int mono_wrapper_init(const char*);
          int mono_wrapper_exec(const char*, int, char**);
          void mono_wrapper_cleanup(void);
          int mono_wrapper_compile(const char*, const char*);
          #endif
          HEOF

          # Create xcframework structure
          mkdir -p ../Mono.xcframework/ios-arm64/lib
          mkdir -p ../Mono.xcframework/ios-arm64/include
          
          # Create a placeholder static library (empty, real Mono will be loaded dynamically)
          ar rcs ../Mono.xcframework/ios-arm64/lib/libmono-wrapper.a /dev/null 2>/dev/null || true
          cp mono_wrapper.h ../Mono.xcframework/ios-arm64/include/
          
          # Create a dummy .a with the wrapper object
          xcrun -sdk iphoneos clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -mios-version-min=16.0 \
            -c mono_wrapper.c -o mono_wrapper.o
          ar rcs ../Mono.xcframework/ios-arm64/lib/libmono-wrapper.a mono_wrapper.o

      - name: Create Info.plist
        run: |
          cat > Mono.xcframework/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundlePackageType</key>
            <string>XFWK</string>
            <key>XCFrameworkFormatVersion</key>
            <string>1.0</string>
            <key>AvailableLibraries</key>
            <array>
              <dict>
                <key>HeadersPath</key>
                <string>ios-arm64/include</string>
                <key>LibraryIdentifier</key>
                <string>ios-arm64</string>
                <key>LibraryPath</key>
                <string>ios-arm64/lib</string>
                <key>SupportedArchitectures</key>
                <array>
                  <string>arm64</string>
                </array>
                <key>SupportedPlatform</key>
                <string>ios</string>
                <key>MinimumPlatformVersion</key>
                <string>16.0</string>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Mono.xcframework
          path: Mono.xcframework/
          retention-days: 30

      - name: Verify build
        run: |
          echo "=== Build Summary ==="
          ls -la Mono.xcframework/ios-arm64/lib/
          ls -la Mono.xcframework/ios-arm64/include/
          file Mono.xcframework/ios-arm64/lib/libmono-wrapper.a || true
          echo "=== Done ==="
