name: Build Mono iOS xcframework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mono via Homebrew
        run: |
          brew install mono

      - name: Find Mono headers and libraries
        run: |
          echo "=== Mono prefix ==="
          MONO_PREFIX=$(brew --prefix mono)
          echo "$MONO_PREFIX"
          
          echo "=== Headers ==="
          find "$MONO_PREFIX" -name "jit.h" 2>/dev/null
          find "$MONO_PREFIX" -name "mono" -type d 2>/dev/null | head -5
          
          echo "=== Libraries ==="
          find "$MONO_PREFIX" -name "libmonosgen*" -o -name "libmono-*" 2>/dev/null | head -10

      - name: Create wrapper C code
        run: |
          mkdir -p mono-wrapper
          cd mono-wrapper

          cat > mono_wrapper.c << 'CEOF'
          #include <stdio.h>
          #include <dlfcn.h>
          #include <stdlib.h>
          #include <string.h>

          typedef void* MonoDomain;
          typedef void* MonoAssembly;
          typedef void* MonoImage;
          typedef void* MonoClass;
          typedef void* MonoMethod;
          typedef void* MonoObject;

          static void* lib_handle = NULL;
          static MonoDomain* domain = NULL;

          static MonoDomain* (*fn_mono_jit_init)(const char*) = NULL;
          static void (*fn_mono_jit_cleanup)(MonoDomain*) = NULL;
          static MonoAssembly* (*fn_mono_domain_assembly_open)(MonoDomain*, const char*) = NULL;
          static MonoImage* (*fn_mono_assembly_get_image)(MonoAssembly*) = NULL;
          static MonoClass* (*fn_mono_class_from_name)(MonoImage*, const char*, const char*) = NULL;
          static MonoMethod* (*fn_mono_class_get_method_from_name)(MonoClass*, const char*, int) = NULL;
          static MonoObject* (*fn_mono_runtime_invoke)(MonoMethod*, void*, void**, MonoObject**) = NULL;
          static void (*fn_mono_config_parse)(const char*) = NULL;
          static char* (*fn_mono_string_to_utf8)(void*) = NULL;

          static int load_mono(void) {
              if (lib_handle) return 0;

              const char* names[] = {
                  "libmonosgen-2.0.1.dylib",
                  "libmonosgen-2.0.dylib",
                  "libmono-2.0.1.dylib",
                  "libmono-2.0.dylib",
                  NULL
              };

              for (int i = 0; names[i]; i++) {
                  lib_handle = dlopen(names[i], RTLD_NOW | RTLD_GLOBAL);
                  if (lib_handle) break;
              }

              if (!lib_handle) {
                  fprintf(stderr, "Cannot load Mono: %s\n", dlerror());
                  return -1;
              }

              fn_mono_jit_init = dlsym(lib_handle, "mono_jit_init");
              fn_mono_jit_cleanup = dlsym(lib_handle, "mono_jit_cleanup");
              fn_mono_domain_assembly_open = dlsym(lib_handle, "mono_domain_assembly_open");
              fn_mono_assembly_get_image = dlsym(lib_handle, "mono_assembly_get_image");
              fn_mono_class_from_name = dlsym(lib_handle, "mono_class_from_name");
              fn_mono_class_get_method_from_name = dlsym(lib_handle, "mono_class_get_method_from_name");
              fn_mono_runtime_invoke = dlsym(lib_handle, "mono_runtime_invoke");
              fn_mono_config_parse = dlsym(lib_handle, "mono_config_parse");
              fn_mono_string_to_utf8 = dlsym(lib_handle, "mono_string_to_utf8");

              if (!fn_mono_jit_init || !fn_mono_domain_assembly_open) {
                  fprintf(stderr, "Cannot find Mono symbols\n");
                  dlclose(lib_handle);
                  lib_handle = NULL;
                  return -1;
              }

              return 0;
          }

          int mono_wrapper_init(const char* assembly_path) {
              if (load_mono() != 0) return -1;

              fn_mono_config_parse(NULL);
              domain = fn_mono_jit_init("mono-embed");
              if (!domain) {
                  fprintf(stderr, "mono_jit_init failed\n");
                  return -1;
              }
              return 0;
          }

          int mono_wrapper_exec(const char* assembly_path, int argc, char** argv) {
              if (!domain) { fprintf(stderr, "Not initialized\n"); return -1; }

              MonoAssembly* assembly = fn_mono_domain_assembly_open(domain, assembly_path);
              if (!assembly) { fprintf(stderr, "Cannot open: %s\n", assembly_path); return -1; }

              MonoImage* image = fn_mono_assembly_get_image(assembly);
              if (!image) { fprintf(stderr, "Cannot get image\n"); return -1; }

              MonoClass* klass = fn_mono_class_from_name(image, "", "Program");
              if (!klass) {
                  fprintf(stderr, "Class 'Program' not found\n");
                  return -1;
              }

              MonoMethod* method = fn_mono_class_get_method_from_name(klass, "Main", 0);
              if (!method) {
                  fprintf(stderr, "Method 'Main' not found\n");
                  return -1;
              }

              MonoObject* exc = NULL;
              fn_mono_runtime_invoke(method, NULL, NULL, &exc);
              if (exc) {
                  fprintf(stderr, "Exception occurred\n");
                  return -1;
              }

              return 0;
          }

          void mono_wrapper_cleanup(void) {
              if (domain && fn_mono_jit_cleanup) {
                  fn_mono_jit_cleanup(domain);
                  domain = NULL;
              }
          }

          int mono_wrapper_compile(const char* source_path, const char* output_path) {
              (void)source_path; (void)output_path;
              return 0;
          }
          CEOF

          cat > mono_wrapper.h << 'HEOF'
          #ifndef MONO_WRAPPER_H
          #define MONO_WRAPPER_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          int mono_wrapper_init(const char*);
          int mono_wrapper_exec(const char*, int, char**);
          void mono_wrapper_cleanup(void);
          int mono_wrapper_compile(const char*, const char*);
          #ifdef __cplusplus
          }
          #endif
          #endif
          HEOF

      - name: Build static library for iOS arm64
        run: |
          cd mono-wrapper
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang -arch arm64 \
            -isysroot "$IOS_SDK" \
            -mios-version-min=16.0 \
            -c mono_wrapper.c -o mono_wrapper.o
          ar rcs libmono-wrapper.a mono_wrapper.o

      - name: Create xcframework
        run: |
          mkdir -p Mono.xcframework/ios-arm64/lib
          mkdir -p Mono.xcframework/ios-arm64/include

          cp mono-wrapper/libmono-wrapper.a Mono.xcframework/ios-arm64/lib/
          cp mono-wrapper/mono_wrapper.h Mono.xcframework/ios-arm64/include/

          cat > Mono.xcframework/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundlePackageType</key>
            <string>XFWK</string>
            <key>XCFrameworkFormatVersion</key>
            <string>1.0</string>
            <key>AvailableLibraries</key>
            <array>
              <dict>
                <key>HeadersPath</key>
                <string>ios-arm64/include</string>
                <key>LibraryIdentifier</key>
                <string>ios-arm64</string>
                <key>LibraryPath</key>
                <string>ios-arm64/lib</string>
                <key>SupportedArchitectures</key>
                <array><string>arm64</string></array>
                <key>SupportedPlatform</key>
                <string>ios</string>
                <key>MinimumPlatformVersion</key>
                <string>16.0</string>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Mono.xcframework
          path: Mono.xcframework/
          retention-days: 30
