name: Build iOS App

on:
  workflow_dispatch: # Позволяет запускать сборку вручную по кнопке

jobs:
  build:
    runs-on: macos-latest # Бесплатный сервер на Mac от GitHub

    steps:
      - name: Загрузка исходного кода
        uses: actions/checkout@v4
        with:
          submodules: recursive # Важно, если проект использует сабмодули

      - name: Выбор версии Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Сборка приложения (Unsigned)
        run: |
          xcodebuild clean build \
            -workspace "CodeApp.xcworkspace" \
            -scheme "CodeApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR="$(pwd)/build"
        # Примечание: Если в проекте нет .xcworkspace, замените -workspace "..." на -project "ИмяПроекта.xcodeproj"

      - name: Упаковка в .ipa
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -qr app.ipa Payload

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: app.ipa
